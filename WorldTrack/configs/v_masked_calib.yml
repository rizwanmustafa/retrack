# Approach 1 on the lighter model: masked fusion + camera dropout + calibration-noise training, so that it differs
# from configs/v_masked_drop.yml only by the calibration noise
model:
  fusion: masked
  coverage_map: false
  cam_dropout_prob: 0.5
  cam_dropout_max: 3
  calib_noise_deg: 0.5
  calib_noise_prob: 0.5
