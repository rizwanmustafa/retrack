{% extends 'layouts/app.html' if principal else 'layouts/public.html' %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<div class="{% if principal %}py-5{% endif %}">
  <div class="text-center {% if principal %}col-lg-6 mx-auto{% endif %}">
    <i class="bi bi-exclamation-octagon fs-1 text-danger"></i>
    <h1 class="h3 mt-2">{{ title }} <span class="text-body-secondary fs-6">({{ status }})</span></h1>
    <p class="lead fs-6">{{ message }}</p>
    <a class="btn btn-outline-primary" href="{{ url_for('auth.index') }}">Back to the dashboard</a>
  </div>
</div>
{% endblock %}
